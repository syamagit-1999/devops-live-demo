<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>DevOps Ecosystem Demo</title>
  <link rel="stylesheet" href="style.css" />
  
  <!-- Devicon for high-quality tool logos -->
  <link rel="stylesheet" type="text/css" href="https://cdn.jsdelivr.net/gh/devicons/devicon@latest/devicon.min.css" />
  
  <!-- Inter font for modern typography -->
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;800&display=swap" rel="stylesheet">
</head>
<body>
  <div class="container">
    <header class="header">
      <h1>🚀 DevOps Live Demo</h1>
      <p>Status: <span class="badge">Version 2.0 - Interactive Ecosystem</span></p>
    </header>

    <div class="tools-grid">
      <!-- Containerization -->
      <div class="tool-card">
        <i class="devicon-docker-plain colored tool-icon"></i>
        <h3>Docker</h3>
        <p>Containerization</p>
      </div>
      
      <!-- Orchestration -->
      <div class="tool-card">
        <i class="devicon-kubernetes-plain colored tool-icon"></i>
        <h3>Kubernetes</h3>
        <p>Orchestration</p>
      </div>
      
      <!-- CI/CD & VCS -->
      <div class="tool-card">
        <i class="devicon-github-original colored tool-icon github-icon"></i>
        <h3>GitHub</h3>
        <p>Version Control & CI/CD</p>
      </div>
      
      <!-- IaC -->
      <div class="tool-card">
        <i class="devicon-terraform-plain colored tool-icon"></i>
        <h3>Terraform</h3>
        <p>Infrastructure as Code</p>
      </div>
      
      <!-- Cloud -->
      <div class="tool-card">
        <i class="devicon-amazonwebservices-original colored tool-icon aws-icon"></i>
        <h3>AWS</h3>
        <p>Cloud Platform</p>
      </div>
      
      <!-- Monitoring -->
      <div class="tool-card">
        <i class="devicon-prometheus-original colored tool-icon"></i>
        <h3>Prometheus</h3>
        <p>Monitoring & Alerting</p>
      </div>
      
      <!-- Config Management -->
      <div class="tool-card">
        <i class="devicon-ansible-plain colored tool-icon"></i>
        <h3>Ansible</h3>
        <p>Configuration Mgmt</p>
      </div>
      
      <!-- Automation -->
      <div class="tool-card">
        <i class="devicon-jenkins-plain colored tool-icon"></i>
        <h3>Jenkins</h3>
        <p>Automation Server</p>
      </div>
    </div>
  </div>
</body>
</html>
